# Pembaruan data faktual setiap 2 jam (bangunkan Render free + panggil ingest).
name: Perbarui data Danita

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Panggil pengambilan sumber
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Override lewat secret APP_URL bila perlu; default = Render.
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-https://media-monitor-kpw-dki.onrender.com}"
          APP_URL="${APP_URL%/}"
          echo "APP_URL=${APP_URL}"

          # Render sering beda CRON_SECRET; User-Agent danita-github-actions / vercel-cron diizinkan server.
          AUTH_HEADER=()
          AGENT="danita-github-actions"
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          # Free Render: cold start ~1 menit — bangunkan dulu.
          echo "Membangunkan layanan…"
          for i in 1 2 3 4 5 6; do
            set +e
            wake=$(curl -sS -m 90 -o /tmp/health.json -w "%{http_code}" "${APP_URL}/api/health")
            set -e
            echo "wake attempt ${i}: HTTP ${wake}"
            if [ "$wake" = "200" ]; then
              break
            fi
            sleep 15
          done

          before=$(python3 -c "import json; print(json.load(open('/tmp/health.json')).get('last_ingest_at') or '')" 2>/dev/null || true)
          echo "last_ingest sebelum: ${before:-"(kosong)"}"

          set +e
          code=$(curl -sS -m 280 -o /tmp/ingest.json -w "%{http_code}" \
            "${AUTH_HEADER[@]}" \
            -H "User-Agent: ${AGENT}" \
            "${APP_URL}/api/cron/ingest")
          curl_rc=$?
          set -e
          echo "HTTP ${code} (curl_rc=${curl_rc})"
          head -c 2000 /tmp/ingest.json 2>/dev/null || true
          echo

          if [ "$code" = "200" ]; then
            echo "Ingest selesai (HTTP 200)."
            exit 0
          fi

          if [ "$code" = "504" ] || [ "$code" = "502" ] || [ "$code" = "000" ] || [ "$code" = "503" ]; then
            echo "Timeout/gateway — cek apakah data sempat terbarui…"
            sleep 10
            after=$(curl -sS -m 90 "${APP_URL}/api/health" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('last_ingest_at') or '')" \
              || true)
            echo "last_ingest sesudah: ${after:-"(kosong)"}"

            if [ -n "$after" ] && [ "$after" != "$before" ]; then
              echo "Data terbarui meski HTTP ${code}. Anggap sukses."
              exit 0
            fi

            AFTER="$after" python3 -c '
          import os, sys
          from datetime import datetime, timedelta, timezone
          after = (os.environ.get("AFTER") or "").strip()
          if not after:
              print("last_ingest kosong setelah timeout")
              sys.exit(1)
          try:
              ts = datetime.fromisoformat(after)
          except Exception as exc:
              print("gagal parse last_ingest:", exc)
              sys.exit(1)
          if ts.tzinfo is None:
              ts = ts.replace(tzinfo=timezone(timedelta(hours=7)))
          now = datetime.now(timezone(timedelta(hours=7)))
          delta = abs((now - ts).total_seconds())
          print(f"delta_seconds={delta:.0f}")
          sys.exit(0 if delta < 20 * 60 else 1)
          '
            exit $?
          fi

          echo "Ingest gagal dengan HTTP ${code}."
          exit 1
