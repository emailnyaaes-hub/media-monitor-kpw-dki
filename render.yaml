# Blueprint Render — New → Blueprint → pilih repo ini.
# Dashboard: https://dashboard.render.com
#
# Wajib diisi saat create (sama seperti di Vercel/Neon):
#   BI_DATABASE_URL  → connection string Neon (unpooled/direct lebih aman)
#   CRON_SECRET      → sama dengan secret GitHub Actions
services:
  - type: web
    name: media-monitor-kpw-dki
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Asia/Jakarta
      - key: BI_FAST_INGEST
        value: "1"
      - key: BI_SKIP_URL_PROBE
        value: "1"
      # Pakai GitHub Actions tiap 2 jam (wake free tier + ingest_lite).
      - key: BI_DISABLE_SCHEDULER
        value: "1"
      - key: BI_AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: BI_DATABASE_URL
        sync: false
