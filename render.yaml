# Blueprint Render — hubungkan repo GitHub sekali, lalu push ke main = deploy ulang.
# Dashboard: https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: media-monitor-kpw-dki
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Asia/Jakarta
      - key: PORT
        value: "8000"
